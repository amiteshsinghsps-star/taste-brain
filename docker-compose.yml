# Neutronz Company Brain — full local stack.
#
#   docker compose up -d --build      # FalkorDB + Postgres + API + built UI on :5000
#   open http://localhost:5000        # sign up -> "Load demo company" -> ask the brain
#   http://localhost:3001             # FalkorDB Browser UI (graph is the product, show it)
#
# FalkorDB holds all company knowledge (one graph per tenant). Postgres holds only
# users, refresh tokens, data-source metadata and audit rows.
#
# Development (hot reload) runs outside these containers: see README "Run it".
#
# The JWT secrets below are throwaway local values. Prisma migrations, not db push,
# bring the relational schema up, so this file works on a blank volume.

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: neutronz-falkordb
    ports:
      - "6379:6379"   # database
      - "3001:3000"   # FalkorDB Browser UI (host 3001 avoids clashing with the Vite client)
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: neutronz-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Neutronz_auth
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Neutronz_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &app-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/Neutronz_auth?schema=public
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      JWT_ACCESS_SECRET: local-dev-access-secret-change-me-32bytes
      JWT_REFRESH_SECRET: local-dev-refresh-secret-change-me-32bytes
      CLIENT_ORIGIN: http://localhost:5000
      # No LLM key -> retrieval still answers with cited graph facts. Add one to
      # enable LLM extraction + synthesis. Never commit a real key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      EMBEDDINGS_DIM: ${EMBEDDINGS_DIM:-256}
      # Live Gmail/Drive/Slack ingestion stays off; the demo graph is synthetic.
      FF_LIVE_CONNECTORS: ${FF_LIVE_CONNECTORS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    container_name: neutronz-app
    ports:
      - "5000:5000"
    environment:
      <<: *app-env
      NODE_ENV: production
    depends_on:
      falkordb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  falkordb_data:
  pg_data:
