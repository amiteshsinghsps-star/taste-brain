name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Neutronz_auth
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # E10: with this set, an unreachable FalkorDB fails the run instead of
      # silently skipping every graph test.
      FALKORDB_REQUIRED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/Neutronz_auth?schema=public
      JWT_ACCESS_SECRET: ci-only-access-secret-please-rotate-32bytes
      JWT_REFRESH_SECRET: ci-only-refresh-secret-please-rotate-32bytes
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify lockfiles are intact (no tampered integrity digests)
        run: node scripts/check-lockfile.mjs

      - name: Install server deps (npm ci = lockfile is the source of truth)
        working-directory: server
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Generate Prisma client and push schema
        working-directory: server
        run: npx prisma generate && npx prisma db push

      - name: Typecheck + build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Unit + graph integration tests (must not skip anything)
        working-directory: server
        run: npm run test:ci

      - name: Fail the build on skipped tests
        run: node scripts/check-no-skips.mjs server/tests/vitest.json

      - name: FalkorDB is genuinely the backend (removal test)
        working-directory: server
        run: npm run test:removal

      - name: Boot the API and run the demo-path end-to-end check
        working-directory: server
        env:
          NODE_ENV: development
        run: |
          node dist/index.js &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5000/api/status && break; sleep 2; done
          npm run e2e:v3
          node ../scripts/check-status.mjs --expect-graph
