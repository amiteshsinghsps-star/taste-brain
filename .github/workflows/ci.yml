name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite (the graph store) needs Node >= 22.5; the Qloo harness needs 22.19+.
          node-version: 22
          cache: npm

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Install client deps
        working-directory: client
        run: npm install

      - name: Typecheck + build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Grounding Auditor + rule engine + pipeline tests
        working-directory: server
        env:
          GRAPH_DB: ':memory:'
          DEFAULT_MODE: replay
        run: npm test

      - name: Taste Lift eval (Replay; writes results.json)
        working-directory: server
        env:
          DEFAULT_MODE: replay
        run: npm run eval

      - name: Boot API and smoke the demo path
        working-directory: server
        env:
          PORT: '4000'
          DEFAULT_MODE: replay
        run: |
          node dist/index.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4000/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:4000/api/packs >/dev/null && echo "packs ok"
          curl -sf -X POST http://127.0.0.1:4000/api/proposals \
            -H 'content-type: application/json' \
            -d '{"pack":"retail","location":"store_3","goal":"Add 4 brands for spring","mode":"replay"}' >/dev/null \
            && echo "proposal ok"

      - name: Secret scan (fail if a Qloo credential is present)
        run: |
          if grep -RilE 'QLOO_API_KEY=[A-Za-z0-9]|sk-proj-[A-Za-z0-9]' --include='*.ts' --include='*.json' --include='*.env' . ; then
            echo "Potential secret found in the repo" && exit 1
          else
            echo "no secrets detected"
          fi
